name: Release

# Baut die Electron-Pakete für Windows (NSIS), macOS (ZIP mit .app,
# x64+arm64) und Linux (AppImage, x64). Auf Tags "v*" wird zusätzlich ein
# GitHub-Release mit den Paketen angelegt (electron-updater liest daraus
# seine Update-Feeds).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    name: Lint / Tests / Next-Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  build:
    name: Paket bauen (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # better-sqlite3 gegen die Electron-ABI bauen (electron-builder macht
      # das beim Packen selbst nochmals - hier als früher Fail-Fast-Check).
      - run: npm run rebuild:electron

      - run: npm run build
      - run: npm run electron:build

      - name: electron-builder
        shell: bash
        run: |
          # Nicht gesetzte Signing-Secrets werden von GitHub Actions als leere
          # Strings exportiert. electron-builder wertet CSC_LINK="" als
          # relativen Dateipfad aus und bricht auf macOS mit
          # "<projektverzeichnis> not a file" ab - daher leere Variablen vor
          # dem Aufruf entfernen (ohne Zertifikat wird unsigniert gebaut).
          # Zusätzlich wird CSC_LINK (Apple Developer ID) nur dem macOS-
          # Runner zugeführt: Auf Windows/Linux würde electron-builder das
          # Apple-Zertifikat sonst (nutzlos) für die Signatur verwenden.
          if [ -z "${CSC_LINK:-}" ] || [ "$RUNNER_OS" != "macOS" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD CSC_IDENTITY_AUTO_DISCOVERY
          fi
          npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code-Signing (optional - ohne diese Secrets werden unsignierte
          # Installer gebaut, siehe README "Code-Signing"):
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_IDENTITY_AUTO_DISCOVERY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: warn

      - name: Release-Upload (nur Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # Siehe Kommentar im Schritt "electron-builder" oben.
          if [ -z "${CSC_LINK:-}" ] || [ "$RUNNER_OS" != "macOS" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD CSC_IDENTITY_AUTO_DISCOVERY
          fi
          npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_IDENTITY_AUTO_DISCOVERY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
