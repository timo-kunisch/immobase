# electron-builder-Konfiguration: NSIS-Installer für Windows, ZIP mit der
# .app für macOS (x64+arm64), AppImage für Linux (x64).
# Auslieferung bewusst "direkt" statt Installer, wo sinnvoll: macOS-ZIP und
# AppImage starten ohne Installation. Windows bleibt NSIS, weil
# electron-updater dort nur NSIS-Pakete aktualisieren kann (macOS: nur ZIP,
# Linux: nur AppImage).
#
# Code-Signing / Notarisierung (Schritt-für-Schritt-Anleitung:
# .github/code-signing.md):
# - macOS: Signatur mit "Developer ID Application"-Zertifikat aus CSC_LINK +
#   CSC_KEY_PASSWORD; Notarisierung (notarytool) läuft automatisch, sobald
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID gesetzt sind
#   (ohne sie: nur eine Warnung, der Build läuft unsigniert durch).
#   CSC_LINK wird im Release-Workflow bewusst NUR dem macOS-Runner
#   zugeführt, damit das Apple-Zertifikat nicht versehentlich für die
#   Windows-Signatur verwendet wird. Dort importiert der Workflow das
#   Zertifikat in eine selbst angelegte Keychain und übergibt sie per
#   CSC_KEYCHAIN an electron-builder - dessen eigener CSC_LINK-Keychain-Pfad
#   ist defekt (set-key-partition-list mit Zertifikats- statt Keychain-
#   Passwort) und bricht auf aktuellen macOS-Runnern ab (Details im
#   Workflow-Kommentar in .github/workflows/release.yml).
# - Windows: aktuell unsigniert (SmartScreen-Hinweis). Ein eigenes Windows-
#   Code-Signing-Zertifikat (OV/EV) ist ein separater Schritt.
appId: de.immobase.app
productName: ImmoBase
copyright: Copyright © 2026

directories:
  output: dist

# Next.js-App (Standalone-Build) und Shell-Seiten liegen außerhalb der asar-
# gepackten App in resources/ - der Main-Prozess lädt sie von dort.
# WICHTIG: better-sqlite3 wird von electron-builder automatisch gegen die
# Electron-ABI neu gebaut (npmRebuild) und als extraResources unter
# resources/standalone/node_modules/better-sqlite3 abgelegt. Das Ziel ist
# nicht willkürlich: Der Turbopack-Standalone-Build referenziert das
# externalisierte Paket über einen gehashten Symlink
#   .next/node_modules/better-sqlite3-<hash> -> ../../node_modules/better-sqlite3
# (es ist bewusst NICHT im Standalone-Trace enthalten, siehe
# outputFileTracingExcludes in next.config.ts). Nur wenn das Symlink-Ziel im
# Paket existiert, löst der require() der Server-Chunks zur Laufzeit auf -
# und der macOS-Signierlauf bricht nicht mit ENOENT am toten Symlink ab.
npmRebuild: true
asar: true

files:
  - dist-electron/**
  - package.json
  - "!**/*.map"
  # Der OCR-Stack (KI-Chat, Scanned-PDF-Erkennung) läuft ausschließlich im
  # eingebetteten Next.js-Server - seine Dateien kommen über den
  # Standalone-Trace nach resources/standalone/node_modules (extraResources
  # unten). Der Electron-Main-Prozess require()t diese Pakete nie; ohne die
  # Ausschlüsse würde electron-builder sie zusätzlich in app.asar duplizieren
  # (~85 MB totes Gewicht im Paket).
  - "!node_modules/tesseract.js/**"
  - "!node_modules/tesseract.js-core/**"
  - "!node_modules/@tesseract.js-data/**"
  - "!node_modules/@napi-rs/**"
  - "!node_modules/wasm-feature-detect/**"

extraResources:
  - from: .next/standalone
    to: standalone
  # WICHTIG: electron-builder filtert das DIREKT im from-Verzeichnis liegende
  # node_modules beim Verzeichnis-Kopieren hart heraus (createFilter in
  # app-builder-lib: relative === "node_modules" -> false; nicht per Pattern
  # übersteuerbar). Der getracete Standalone-node_modules-Baum (next, react,
  # ...) braucht daher einen eigenen Eintrag, dessen from das node_modules-
  # Verzeichnis selbst ist - sonst schlägt require("next") im Paket mit
  # "Cannot find module 'next'" fehl.
  - from: .next/standalone/node_modules
    to: standalone/node_modules
  - from: .next/static
    to: standalone/.next/static
  - from: public
    to: standalone/public
  - from: node_modules/better-sqlite3
    to: standalone/node_modules/better-sqlite3
  - from: electron/shell
    to: shell

# electron-updater: GitHub-Releases. OFFLINE-TOLERANT - die App funktioniert
# ohne Update-Server vollständig (die Prüfung schlägt dann still fehl).
publish:
  provider: github
  owner: timo-kunisch
  repo: immobase
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}-win-x64.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: ImmoBase

mac:
  target:
    # ZIP statt DMG: liefert die .app direkt aus (entpacken -> starten) und
    # ist das einzige macOS-Format, das electron-updater verarbeiten kann.
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.business
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  # Notarisierung via notarytool: Läuft automatisch, sobald APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD und APPLE_TEAM_ID gesetzt sind; ohne sie
  # wird sie mit einer Warnung übersprungen (Build läuft durch).
  notarize: true

linux:
  target:
    # AppImage: eine einzelne, direkt ausführbare Datei (chmod +x -> starten),
    # keine Installation nötig - und das einzige Linux-Format mit
    # electron-updater-Unterstützung.
    - target: AppImage
      arch: [x64]
  category: Office
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
